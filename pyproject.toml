[project]
name = "argus"
version = "0.1.0"
description = "RAG-enhanced multi-agent pull request reviewer built with LangGraph, ChromaDB and Gemini."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-chroma>=0.1.4",
    "chromadb>=0.5.0",
    "gitpython>=3.1.43",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "evaluation"]
extend-exclude = ["temp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["argus", "evaluation"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["^temp/", "^tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Tests are plain functions; this stops pytest from mistaking model classes
# whose names start with "Test" for test classes.
python_classes = "NoClassBasedTests"
